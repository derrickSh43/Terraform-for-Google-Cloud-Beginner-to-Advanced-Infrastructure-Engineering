name: course-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  selftest:
    name: Validators accept solutions and reject bad fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3
        with:
          terraform_version: "1.17.2"
          terraform_wrapper: false

      - name: Cache Terraform providers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: .course/plugin-cache
          key: tf-providers-${{ runner.os }}-${{ hashFiles('shared/terraform/.terraform.lock.hcl') }}

      - name: Unit tests (coursekit)
        run: python -m unittest discover -s tests -t . -v

      - name: Download providers from the Terraform Registry
        run: python course.py setup

      - name: Self-test every ready lesson
        run: python course.py selftest --workers 6
